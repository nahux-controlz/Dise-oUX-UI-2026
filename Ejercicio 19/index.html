<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 19 - Formulario Multi-step y Validación</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor-form">
        <h2>Registro</h2>
        
        <form action="#">
            <input type="radio" name="pasos" id="paso1" class="radio-oculto" checked>
            <input type="radio" name="pasos" id="paso2" class="radio-oculto">

            <div class="seccion-paso" id="seccion-paso1">
                <h3>Paso 1: Datos Personales</h3>
                <div class="grupo-input">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required placeholder="Ingresa tu nombre">
                </div>
                <div class="grupo-input">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" required placeholder="Ingresa tu apellido">
                </div>
                <label for="paso2" class="btn-navegacion btn-siguiente">Siguiente ➔</label>
            </div>

            <div class="seccion-paso" id="seccion-paso2">
                <h3>Paso 2: Cuenta</h3>
                <div class="grupo-input">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="grupo-input">
                    <label for="pass">Contraseña:</label>
                    <input type="password" id="pass" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="contenedor-botones">
                    <label for="paso1" class="btn-navegacion btn-volver">🡄 Volver</label>
                    <button type="submit" class="btn-enviar">Registrarse</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
