<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9 - Galería de Tarjetas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Nuestros Productos</h1>
    <div class="galeria">
        <div class="tarjeta-producto">
            <img src="img/1.jpg" alt="Producto 1">
            <h2>Auriculares HyperX</h2>
            <p class="precio">$85.000</p>
            <button>Comprar</button>
        </div>
        <div class="tarjeta-producto">
            <img src="img/2.jpg" alt="Producto 2">
            <h2>Mouse Logitech</h2>
            <p class="precio">$35.000</p>
            <button>Comprar</button>
        </div>
        <div class="tarjeta-producto">
            <img src="img/3.jpg" alt="Producto 3">
            <h2>Teclado Mecánico</h2>
            <p class="precio">$60.000</p>
            <button>Comprar</button>
        </div>
        <div class="tarjeta-producto">
            <img src="img/4.jpg" alt="Producto 4">
            <h2>Monitor 24"</h2>
            <p class="precio">$150.000</p>
            <button>Comprar</button>
        </div>
        <div class="tarjeta-producto">
            <img src="img/5.jpg" alt="Producto 5">
            <h2>Pad Mouse XL</h2>
            <p class="precio">$15.000</p>
            <button>Comprar</button>
        </div>
        <div class="tarjeta-producto">
            <img src="img/6.jpg" alt="Producto 6">
            <h2>Silla Gamer</h2>
            <p class="precio">$220.000</p>
            <button>Comprar</button>
        </div>
    </div>
</body>
</html>
